<!doctype html>
<meta charset="utf-8">
<title>browser-profiles</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #222; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  button { margin-right: .3rem; }
  .running { color: #0a7a2f; } .stopped { color: #a15c00; } .absent { color: #777; }
  form { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin-top: 1.5rem; }
  form label { display: flex; flex-direction: column; font-size: 12px; color: #555; }
  form input, form select { padding: .3rem; }
  pre { background: #f5f5f5; padding: .5rem; overflow: auto; }
  #token-row { display: flex; gap: .5rem; align-items: center; }
</style>

<h1>browser-profiles</h1>
<div id="token-row">
  <label>API token <input id="token" type="password" size="40"></label>
  <button onclick="saveToken()">Use</button>
</div>

<table id="list"><thead><tr>
  <th>Name</th><th>Status</th><th>Proxy</th><th>Timezone</th><th>Directory</th><th></th>
</tr></thead><tbody></tbody></table>

<form onsubmit="create(event)">
  <label>Name <input name="name" required pattern="[a-z0-9][a-z0-9-]{0,30}"></label>
  <label>Timezone <input name="timezone" value="UTC"></label>
  <label>Start URL <input name="start_url" value="about:blank"></label>
  <label>Proxy scheme <select name="scheme"><option>http</option><option>socks5</option></select></label>
  <label>Proxy host <input name="host"></label>
  <label>Proxy port <input name="port" type="number"></label>
  <label>Proxy user <input name="username"></label>
  <label>Proxy password <input name="password" type="password"></label>
  <button>Create and start</button>
</form>

<pre id="out"></pre>

<script>
const out = document.getElementById("out");
const tokenInput = document.getElementById("token");
tokenInput.value = localStorage.getItem("token") || "";

function saveToken() { localStorage.setItem("token", tokenInput.value); refresh(); }

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { "Authorization": "Bearer " + tokenInput.value, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await r.text();
  if (!r.ok) { out.textContent = `${method} ${path} -> ${r.status}\n${text}`; throw new Error(text); }
  return text ? JSON.parse(text) : null;
}

async function refresh() {
  const rows = await api("GET", "/profiles");
  const tbody = document.querySelector("#list tbody");
  tbody.innerHTML = "";
  for (const p of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.name}</td>
      <td class="${p.status}">${p.status}</td>
      <td>${p.proxy ?? "direct"}</td>
      <td>${p.timezone}</td>
      <td><code>${p.data_dir}</code></td>
      <td>
        <a href="${p.ui_url}" target="_blank"><button ${p.status !== "running" ? "disabled" : ""}>Open</button></a>
        <button onclick="act('${p.name}','start')">Start</button>
        <button onclick="act('${p.name}','stop')">Stop</button>
        <button onclick="act('${p.name}','egress')">Egress</button>
        <button onclick="del('${p.name}')">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  }
}

async function act(name, action) {
  out.textContent = `${action} ${name}…`;
  const result = await api("POST", `/profiles/${name}/${action}`);
  out.textContent = JSON.stringify(result, null, 2);
  refresh();
}

async function del(name) {
  const purge = confirm(`Delete "${name}" including its Chromium data (cookies, logins)?\nCancel keeps the data on disk and only removes the containers.`);
  if (!purge && !confirm(`Remove containers of "${name}" and forget it, keeping data?`)) return;
  await api("DELETE", `/profiles/${name}?purge=${purge}`);
  refresh();
}

async function create(event) {
  event.preventDefault();
  const f = new FormData(event.target);
  const body = { name: f.get("name"), timezone: f.get("timezone"), start_url: f.get("start_url") };
  if (f.get("host")) body.proxy = {
    scheme: f.get("scheme"), host: f.get("host"), port: Number(f.get("port")),
    username: f.get("username") || null, password: f.get("password") || null,
  };
  out.textContent = "creating…";
  out.textContent = JSON.stringify(await api("POST", "/profiles", body), null, 2);
  event.target.reset();
  refresh();
}

if (tokenInput.value) refresh();
</script>
