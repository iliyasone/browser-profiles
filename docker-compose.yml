services:
  api:
    build: .
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      HOST_DATA_DIR: ${HOST_DATA_DIR:?set HOST_DATA_DIR in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DOCKER_NETWORK: browser-profiles
      BROWSER_UI_USER: ${BROWSER_UI_USER:-}
      BROWSER_UI_PASSWORD: ${BROWSER_UI_PASSWORD:-}
      IDLE_STOP_MINUTES: ${IDLE_STOP_MINUTES:-15}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DATA_DIR:?set HOST_DATA_DIR in .env}:/data
    networks: [browser-profiles]

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${LISTEN:-127.0.0.1:8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [browser-profiles]

networks:
  browser-profiles:
    # The API creates browser containers on this network; the gateway reaches
    # them by container name through Docker's embedded DNS.
    name: browser-profiles
