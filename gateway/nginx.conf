# One entry point: the API and its page at /, every browser screen at /b/<name>/.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  resolver 127.0.0.11 valid=10s;
  client_max_body_size 100m;

  # /b/<name>/... -> the profile's container, which serves that same prefix itself.
  location ~ ^/b/(?<name>[a-z0-9-]+)/ {
    set $upstream http://bp-$name:3000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # A screen whose container is still booting (or being recreated) answers
    # 502/504; show a self-refreshing page instead of a bare gateway error.
    proxy_intercept_errors on;
    error_page 502 503 504 = @starting;
  }

  location @starting {
    default_type text/html;
    add_header Refresh "3";
    return 503 '<!doctype html><meta charset="utf-8"><title>Starting</title><body style="font:16px system-ui;padding:3rem;color:#333">The browser is starting, this page retries every 3 seconds.</body>';
  }

  location / {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
